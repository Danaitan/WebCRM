# ============================================================================
# Custom Nginx Configuration — Nginx Proxy Manager
# Proxy Host: hoy.microleasingplc.com -> 192.168.101.52:8888 (/crmweb)
# ============================================================================

# ---- เวอร์ชันที่ทำงานได้แน่นอน (ยืนยันแล้วเว็บเข้าได้) ----
rewrite ^/crmweb/(.*)$ /$1 break;
proxy_redirect / /crmweb/;
proxy_cookie_path / /crmweb/;
proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter_types text/html text/css application/javascript;
sub_filter 'href="/' 'href="/crmweb/';
sub_filter 'src="/' 'src="/crmweb/';
sub_filter 'action="/' 'action="/crmweb/';

# ---- เพิ่ม favicon (แก้ tab หมุนค้าง) ----
# ถ้าใส่ location แล้ว ERR_CONNECTION_CLOSED ให้ลบ block นี้ออก
# แล้วใช้ favicon-plan-B ด้านล่างแทน
location = /favicon.ico {
    return 301 /crmweb/favicon.ico;
}

# ============================================================================
# favicon-plan-B (ใช้แทน location ด้านบน ถ้า location ทำให้ nginx พัง)
# ----------------------------------------------------------------------------
# วิธีนี้ไม่ใช้ location เลย — ตัด <link> favicon ที่ root ออกจาก HTML
# ด้วย sub_filter (directive แบบเดียวกับที่ใช้อยู่ ปลอดภัยกว่า) แล้วปล่อยให้
# <link rel="icon" href="/crmweb/favicon.ico"> ของแอปทำงานแทน:
#
#   # (ไม่ต้องมี location) ปล่อย browser ขอ /favicon.ico แล้วมันจะ 404/หมุน
#   # แต่ถ้าอยากตัดให้เงียบ ให้แอป (Program.cs) map /favicon.ico ที่ root ด้วย
#   # middleware ก่อน PathBase — แต่ proxy ตัด /crmweb ทำให้ root ไม่เข้าแอป
#   # จึงต้องพึ่ง location ที่ nginx เท่านั้นสำหรับ root favicon.
#
# สรุป: ถ้า location ใช้ไม่ได้จริงในช่องนี้ของ NPM ให้ลองย้ายไปใส่ที่
# "Custom locations" tab ของ NPM แทน (NPM มี UI แยกสำหรับเพิ่ม location)
# โดยตั้ง location path = /favicon.ico แล้วใส่ advanced config: return 301 /crmweb/favicon.ico;
# ============================================================================
